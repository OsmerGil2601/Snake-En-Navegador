<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game | Portafolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-container">
    <header class="scoreboard">
      <div class="score-box">
        <span class="label">PUNTUACIÓN</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="score-box">
        <span class="label">RÉCORD</span>
        <span id="highScore" class="value">0</span>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">SNAKE</h2>
        <p id="overlaySubtitle">Usa las flechas o WASD para moverte. Espacio para pausar.</p>
        <button id="startBtn" type="button">Jugar</button>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
